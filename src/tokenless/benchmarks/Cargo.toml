# Tokenless Benchmark Suite — standalone Cargo workspace.
#
# Kept OUT of the main tokenless workspace on purpose:
#   * the main `[profile.release]` sets `panic = "abort"`, which breaks
#     criterion's measurement harness (it relies on unwinding);
#   * `cargo test --workspace` in the main tree should not pull in these
#     heavy benchmark-only dependencies (criterion) nor run the adversarial
#     load tests as part of the normal unit-test cycle.
#
# Depends on the tokenless crates by path so it always benchmarks the exact
# working-tree sources next to it.
[workspace]

[package]
name = "tokenless-bench"
version = "0.7.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Benchmark and quality/adversarial test suite for tokenless compression"

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
toon-format = { version = "0.5", default-features = false }
tokenless-schema = { path = "../crates/tokenless-schema" }
tokenless-ccr = { path = "../crates/tokenless-ccr" }
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# criterion needs unwinding; keep the default (no panic=abort) here.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# --- Performance benchmarks (criterion, custom harness) ---
[[bench]]
name = "schema_latency"
harness = false

[[bench]]
name = "response_latency"
harness = false

[[bench]]
name = "toon_latency"
harness = false

[[bench]]
name = "pipeline_latency"
harness = false

# Cross-process rtk rewrite latency (ms-range; see file-top methodology note).
[[bench]]
name = "rtk_latency"
harness = false
